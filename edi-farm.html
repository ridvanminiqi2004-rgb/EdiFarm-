<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edi Farm</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--wood:#3a2415;--gold:#e8b53c;--leaf:#4f8f31;--bg:#f1f3ea;--card:#fffdf8;--ink:#2a1d12;--mut:#7a6a58;--line:#ddd8c8;--bad:#b3392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17120d;--card:#241b13;--ink:#f3ecdf;--mut:#b3a38c;--line:#3d3124;--bad:#e8806f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#17120d;--card:#241b13;--ink:#f3ecdf;--mut:#b3a38c;--line:#3d3124;--bad:#e8806f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif}
h1,h2,.num{font-family:"Alfa Slab One",Georgia,serif;font-weight:400}
h2{font-size:1.15rem;margin:1.4rem 0 .6rem}
header{background:var(--wood);color:#fff;display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-bottom:4px solid var(--gold)}
header img{width:44px;height:44px;border-radius:50%}
header b{flex:1;font-family:"Alfa Slab One",Georgia,serif;font-weight:400;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:.35rem .6rem;font:inherit;font-size:.85rem}
nav{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem .9rem;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;border:0;background:none;color:var(--mut);font:800 .95rem Nunito,sans-serif;padding:.45rem .8rem;border-radius:99px}
nav button.on{background:var(--gold);color:var(--wood)}
main{max-width:640px;margin:0 auto;padding:1rem .9rem 3rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem}
.stat .num{font-size:1.7rem;color:var(--leaf)}.stat span{display:block;color:var(--mut);font-size:.85rem}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;display:grid;gap:.6rem}
label{display:grid;gap:.2rem;font-weight:700;font-size:.88rem}
input,select{font:inherit;padding:.6rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.pri{background:var(--wood);color:var(--gold);border:0;border-radius:10px;padding:.7rem;font:800 1rem Nunito,sans-serif}
ul{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.4rem}
li{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:.55rem .7rem}
li span{margin-left:auto;color:var(--mut);font-size:.82rem;text-align:right}
li b{font-weight:800}
.x{border:0;background:none;color:var(--mut);font-size:1.3rem;padding:0 .3rem}
.chk{display:flex;align-items:center;gap:.5rem;font-size:1rem}.chk input{width:auto}
.done{text-decoration:line-through;color:var(--mut)}
.pos{color:var(--leaf)}.neg{color:var(--bad)}.mut,small{color:var(--mut)}
.auth{text-align:center}.auth form{text-align:left;border:0;background:none;padding:0}
.logo{width:170px;height:170px;border-radius:50%;margin:.5rem auto;display:block;border:4px solid var(--gold)}
.links{display:grid;gap:.3rem;margin:.8rem 0}.links button{background:none;border:0;color:var(--leaf);font:800 .95rem Nunito,sans-serif;text-decoration:underline}
#msg{min-height:1.3em;margin:0;font-weight:700}.err{color:var(--bad)}.ok{color:var(--leaf)}
.top{display:flex;justify-content:flex-end;padding:.6rem .9rem}.top button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:.35rem .7rem;font:inherit}
.rem{display:flex;gap:.5rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:.5rem;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.auth h1{font-size:2rem}.pw{margin:1.6rem 0 0;font-size:.75rem;color:var(--mut)}.feat{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1.2rem 0;text-align:left}.feat .stat div{font-size:1.5rem}.feat .stat:last-child{grid-column:1/-1}
</style></head>

let lang=ls.g('edi_lang','en'),me=ls.g('edi_me',null),tab='home',mode='landing',D=null;
const t=k=>(L[k]||[k,k])[lang=='sq'?1:0],$=s=>document.querySelector(s),v=i=>($('#'+i)||{}).value||'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const today=()=>new Date().toISOString().slice(0,10),plus=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const h=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const load=()=>{D=Object.assign({farm:'',flocks:[],eggs:[],sales:[],weights:[],money:[],health:[]},ls.g('edi_d_'+me,{}))},save=()=>ls.s('edi_d_'+me,D);
const sum=(a,f)=>a.reduce((x,r)=>x+(+f(r)||0),0);
const fn=id=>esc((D.flocks.find(f=>f.id==id)||{}).name||'—');
const C={flocks:[['name','text'],['type','sel',['layers','broiler']],['count','number'],['date','date']],
eggs:[['date','date'],['flock','flock','layers'],['n','number'],['broken','number']],
sales:[['date','date'],['qty','number'],['amount','number']],
weights:[['date','date'],['flock','flock','broiler'],['avg','number']],
money:[['date','date'],['kind','sel',['feed','expense','income']],['amount','number'],['note','text']],
health:[['date','date'],['title','text']]};
const OPT=['broken','note'];
const R={flocks:r=>`<b>${esc(r.name)}</b><span>${t(r.type)} · ${r.count}</span>`,
eggs:r=>`<b>${r.n}</b> ${fn(r.flock)}<span>${r.date}${+r.broken?' · −'+r.broken:''}</span>`,
sales:r=>`<b class=pos>+${r.amount}</b> ${r.qty}<span>${r.date}</span>`,
weights:r=>`<b>${r.avg} kg</b> ${fn(r.flock)}<span>${r.date}</span>`,
money:r=>`<b class="${r.kind=='income'?'pos':'neg'}">${r.kind=='income'?'+':'−'}${r.amount}</b> ${t(r.kind)}<span>${r.date}${r.note?' · '+esc(r.note):''}</span>`,
health:r=>`<label class=chk><input type=checkbox ${r.done?'checked':''} onchange="tog(${r.id})"><b class="${r.done?'done':''}">${esc(r.title)}</b></label><span class="${!r.done&&r.date<=today()?'neg':''}">${r.date}</span>`};
function fld(c,[k,ty,o]){const i=`${c}_${k}`,l=t(k);
 if(ty=='sel')return `<label>${l}<select id="${i}">${o.map(x=>`<option value="${x}">${t(x)}</option>`).join('')}</select></label>`;
 if(ty=='flock')return `<label>${l}<select id="${i}">${D.flocks.filter(f=>f.type==o).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>`;
 return `<label>${l}<input id="${i}" type="${ty}" ${ty=='number'?'min=0 step=any inputmode=decimal':''} ${ty=='date'?`value="${today()}"`:''}></label>`}
function sec(c){const bad=C[c].some(f=>f[1]=='flock'&&!D.flocks.some(x=>x.type==f[2]));
 const rows=[...D[c]].sort((a,b)=>b.date<a.date?-1:1).slice(0,25);
 return `<h2>${t(c)}</h2>`+(bad?`<p class=box>${t('needflock')}</p>`:`<form onsubmit="return add('${c}')">${C[c].map(f=>fld(c,f)).join('')}<button class=pri>${t('add')}</button></form>`)+
 `<ul>${rows.map(r=>`<li>${R[c](r)}<button class=x aria-label="×" onclick="del('${c}',${r.id})">×</button></li>`).join('')||`<p class=mut>${t('empty')}</p>`}</ul>`}
function add(c){const r={id:Date.now()};
 for(const [k] of C[c]){const x=v(`${c}_${k}`).trim();if(!x&&!OPT.includes(k))return false;r[k]=x}
 if(c=='health')r.done=false;D[c].push(r);save();render();return false}
const del=(c,id)=>{D[c]=D[c].filter(r=>r.id!=id);save();render()};
const tog=id=>{const r=D.health.find(x=>x.id==id);r.done=!r.done;save();render()};
const fin=m=>{const f=r=>!m||r.date.startsWith(m);
 const inc=sum(D.money.filter(r=>r.kind=='income'&&f(r)),r=>r.amount)+sum(D.sales.filter(f),r=>r.amount);
 const exp=sum(D.money.filter(r=>r.kind!='income'&&f(r)),r=>r.amount);return{inc,exp,pr:inc-exp}};
const rem=()=>{const a=[],d=today();
 if(D.flocks.some(f=>f.type=='layers')&&!D.eggs.some(e=>e.date==d))a.push(['🥚',t('r_eggs')]);
 if(D.flocks.length&&!D.money.some(m=>m.kind=='feed'&&m.date==d))a.push(['🌾',t('r_feed')]);
 D.health.filter(x=>!x.done&&x.date<=plus(7)).forEach(x=>a.push(['💉',`${x.title} · ${x.date}`]));return a};
function notify(){try{if(Notification.permission=='granted')rem().forEach(a=>new Notification('Edi Farm',{body:a[1]}))}catch(e){}}
function askNotif(){try{Notification.requestPermission().then(notify)}catch(e){}}
const fmt=n=>(Math.round(n*100)/100).toLocaleString(lang=='sq'?'sq-AL':'en');
const sc=(n,l,c='')=>`<div class=stat><div class="num ${c}">${n}</div><span>${l}</span></div>`;
const V={
home(){const m=today().slice(0,7),f=fin(m),r=rem();
 return `<div class=grid>${sc(sum(D.flocks,x=>x.count),t('birds'))}${sc(sum(D.eggs.filter(e=>e.date==today()),e=>e.n),t('eggsToday'))}${sc(sum(D.eggs.filter(e=>e.date.startsWith(m)),e=>e.n),t('eggsMonth'))}${sc(fmt(f.pr),t('profit'),f.pr<0?'neg':'')}</div>
 <h2>${t('reminders')}</h2><ul>${r.map(a=>`<li><span style="margin:0">${a[0]}</span>${esc(a[1])}</li>`).join('')||`<p class=mut>${t('r_clear')}</p>`}</ul>
 <h2>${t('myfarm')}</h2><form onsubmit="D.farm=v('fm').trim();save();render();return false"><label>${t('farm')}<input id=fm value="${esc(D.farm)}"></label><button class=pri>${t('add')}</button></form>`},
flocks:()=>sec('flocks'),eggs:()=>sec('eggs')+sec('sales'),
broilers(){const bs=D.flocks.filter(f=>f.type=='broiler');
 const sm=bs.map(f=>{const w=D.weights.filter(x=>x.flock==f.id).sort((a,b)=>a.date<b.date?-1:1),l=w[w.length-1],p=w[w.length-2];
  const age=Math.max(0,Math.floor((Date.now()-new Date(f.date))/864e5));
  return `<li><b>${esc(f.name)}</b><span>${t('day')} ${age}${l?` · ${l.avg} kg${p?` (+${fmt(l.avg-p.avg)})`:''}`:''}</span></li>`}).join('');
 return (bs.length?`<ul>${sm}</ul>`:`<p class=box>${t('nobroil')}</p>`)+sec('weights')},
money(){const f=fin();return `<div class=grid>${sc(fmt(f.inc),t('income'),'pos')}${sc(fmt(f.exp),t('expenses'),'neg')}</div>${sec('money')}`},
health:()=>sec('health')+`<p><button class=pri onclick="askNotif()">🔔 ${t('notif')}</button></p>`,
reports(){const ms=[...new Set([...D.eggs,...D.sales,...D.money].map(r=>r.date.slice(0,7)))].sort().reverse();
 return `<h2>${t('tab_reports')}</h2>`+(ms.length?`<div class=tw><table><tr><th>${t('month')}</th><th>${t('eggsCol')}</th><th>${t('income')}</th><th>${t('expenses')}</th><th>${t('bal')}</th></tr>${ms.map(m=>{const f=fin(m);return `<tr><td>${m}</td><td>${fmt(sum(D.eggs.filter(e=>e.date.startsWith(m)),e=>e.n))}</td><td>${fmt(f.inc)}</td><td>${fmt(f.exp)}</td><td class="${f.pr<0?'neg':'pos'}"><b>${fmt(f.pr)}</b></td></tr>`}).join('')}</table></div>`:`<p class=mut>${t('empty')}</p>`)}};
const flash=(m,ok)=>{if(ok)render();const e=$('#msg');e.textContent=m;e.className=ok?'ok':'err'};
function auth(){const e=v('em').trim().toLowerCase(),p=v('pw'),U=ls.g('edi_users',{});
 if(mode=='register'){const n=v('nm').trim(),s=v('sn').trim();if(!n||!s||!e||p.length<6)return flash(t('e_fill'));if(U[e])return flash(t('e_exists'));U[e]={n,s,p:h(p)};ls.s('edi_users',U)}
 else if(mode=='reset'){if(!U[e])return flash(t('e_login'));if(p.length<6)return flash(t('e_fill'));U[e].p=h(p);ls.s('edi_users',U);mode='login';return flash(t('ok_reset'),1)}
 else if(!U[e]||U[e].p!==h(p))return flash(t('e_login'));
 me=e;ls.s('edi_me',e);load();tab='home';render();notify();return false}
const setMode=m=>{mode=m;render()},setLang=()=>{lang=lang=='en'?'sq':'en';ls.s('edi_lang',lang);render()};
const out=()=>{me=null;ls.s('edi_me',null);render()};
const TABS=['home','flocks','eggs','broilers','money','health','reports'];
function render(){document.documentElement.lang=lang;const lb=`<button onclick="setLang()" aria-label="Language">${lang=='en'?'🇦🇱 Shqip':'🇬🇧 English'}</button>`;
 if(!me&&mode=='landing'){$('#app').innerHTML=`<div class=top>${lb}</div><main class=auth><img class=logo src="${LOGO}" alt="Edi Farm"><h1>Edi Farm</h1><p>${t('l_tag')}</p><div class=feat>${['🥚','🐔','🌾','💉','📊'].map((e,i)=>`<div class=stat><div>${e}</div><b>${t('l_f'+i)}</b></div>`).join('')}</div><button class=pri style="width:100%" onclick="setMode('register')">${t('register')}</button><div class=links><button onclick="setMode('login')">${t('login')}</button></div><p class=pw>Powered by: RidvanM</p></main>`;return}
 if(!me){const m=mode;$('#app').innerHTML=`<div class=top>${lb}</div><main class=auth><img class=logo src="${LOGO}" alt="Edi Farm"><h1>${t(m=='register'?'register':m=='reset'?'reset':'login')}</h1>
 <form onsubmit="auth();return false">${m=='register'?`<label>${t('name')}<input id=nm autocomplete=given-name></label><label>${t('surname')}<input id=sn autocomplete=family-name></label>`:''}
 <label>${t('email')}<input id=em type=email autocomplete=email></label><label>${t(m=='reset'?'newpw':'password')}<input id=pw type=password autocomplete="${m=='login'?'current-password':'new-password'}"></label>
 <p id=msg role=alert></p><button class=pri>${t(m=='register'?'register':m=='reset'?'reset':'login')}</button></form>
 <div class=links>${m=='login'?`<button onclick="setMode('register')">${t('noacc')}</button><button onclick="setMode('reset')">${t('forgot')}</button>`:`<button onclick="setMode('login')">${t('haveacc')}</button>`}</div><small>${t('demo')}</small><p class=pw>Powered by: RidvanM</p></main>`;return}
 if(!D)load();
 $('#app').innerHTML=`<header><img src="${LOGO}" alt=""><b>${esc(D.farm||'Edi Farm')}</b>${lb}<button onclick="out()">${t('logout')}</button></header>
 <nav>${TABS.map(x=>`<button class="${x==tab?'on':''}" onclick="tab='${x}';render()">${t('tab_'+x)}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
render();
</script></body></html>
